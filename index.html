<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Mandolin - Menü</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f5f5f7;color:#1a1a2e;padding:16px;max-width:720px;margin:0 auto}
h1{text-align:center;font-size:24px;font-weight:600;margin-bottom:4px}
p.subtitle{text-align:center;font-size:14px;color:#666;margin-bottom:24px}
.category{margin-bottom:28px}
.category h2{font-size:17px;font-weight:600;margin-bottom:12px;color:#1a1a2e;border-bottom:2px solid #1a1a2e;padding-bottom:6px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:#fff;border-radius:12px;padding:14px;cursor:pointer;border:1px solid #e5e5e7;transition:transform .15s ease,box-shadow .15s ease;overflow:hidden}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.card-img{width:100%;height:140px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px;background-size:cover;background-position:center;background-repeat:no-repeat}
.card-name{font-size:14px;font-weight:600;margin-bottom:4px;color:#1a1a2e}
.card-price{font-size:15px;color:#333;font-variant-numeric:tabular-nums;font-weight:500}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-card{background:#fff;border-radius:16px;max-width:380px;width:100%;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.2);transform:scale(.95);opacity:0;transition:transform .2s ease,opacity .2s ease}
.modal-card.active{transform:scale(1);opacity:1}
.modal-img{height:220px;display:flex;align-items:center;justify-content:center;font-size:72px;background-size:cover;background-position:center;background-repeat:no-repeat}
.modal-body{padding:20px}
.modal-title{font-size:19px;font-weight:600;margin-bottom:6px;color:#1a1a2e}
.modal-desc{font-size:14px;color:#555;line-height:1.6;margin-bottom:16px}
.modal-footer{display:flex;align-items:center;justify-content:space-between}
.modal-price{font-size:24px;font-weight:600;color:#1a1a2e;font-variant-numeric:tabular-nums}
.modal-close{background:#1a1a2e;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer}
.modal-close:hover{background:#333}
</style>
</head>
<body>

<h1>My Mandolin</h1>
<p class="subtitle">Ürüne dokunarak detayları gör</p>

<div id="menu"></div>

<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
  <div id="modal-card" class="modal-card">
    <div id="modal-img" class="modal-img"></div>
    <div class="modal-body">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-desc" class="modal-desc"></div>
      <div class="modal-footer">
        <span id="modal-price" class="modal-price"></span>
        <button class="modal-close" onclick="closeModal()">Kapat</button>
      </div>
    </div>
  </div>
</div>

<script>
const menu = {
  "Pizzalar": [
    {name:"Margarita",price:"185 ₺",desc:"Domates sos, mozzarella peyniri, taze fesleğen",icon:"🍕",grad:"#FF6B6B,#4ECDC4"},
    {name:"Karışık",price:"220 ₺",desc:"Sucuk, mantar, zeytin, biber, mozzarella",icon:"🍕",grad:"#FF6B6B,#FF8E53"},
    {name:"Sucuklu",price:"210 ₺",desc:"Özel sucuk, mozzarella, domates sos",icon:"🍕",grad:"#FF8E53,#6C757D"},
    {name:"Sebzeli",price:"195 ₺",desc:"Mantar, biber, domates, zeytin, mozzarella",icon:"🍕",grad:"#4ECDC4,#FF6B6B"}
  ],
  "Hamburgerler": [
    {name:"Cheeseburger",price:"175 ₺",desc:"150gr dana köfte, cheddar peyniri, marul, domates, özel sos",icon:"🍔",img:"cheeseburger.webp",grad:"#FF8E53,#6C757D"},
    {name:"Tavuk Burger",price:"160 ₺",desc:"Çıtır tavuk, coleslaw, turşu, burger sosu",icon:"🍔",grad:"#FF6B6B,#4ECDC4"},
    {name:"Mushroom Swiss",price:"190 ₺",desc:"Karamelize mantar, swiss peyniri, truffle mayonez",icon:"🍔",grad:"#6C757D,#FF8E53"}
  ],
  "Kahvaltılar": [
    {name:"Serpme Kahvaltı (2 Kişilik)",price:"450 ₺",desc:"Beyaz peynir, kaşar, zeytin, bal-kaymak, domates, salatalık, yumurta, reçel",icon:"🍳",grad:"#4ECDC4,#FF6B6B"},
    {name:"Menemen",price:"120 ₺",desc:"Domates, biber, yumurta, tereyağı",icon:"🍳",grad:"#4ECDC4,#A78BFA"},
    {name:"Sahanda Yumurta",price:"95 ₺",desc:"2 adet yumurta, tereyağı, baharat",icon:"🍳",grad:"#A78BFA,#6C757D"}
  ],
  "Atıştırmalıklar": [
    {name:"Patates Kızartması",price:"85 ₺",desc:"Çıtır patates, özel baharat karışımı",icon:"🍟",grad:"#A78BFA,#FF8E53"},
    {name:"Soğan Halkası",price:"95 ₺",desc:"Çıtır kaplamalı soğan halkaları, sarımsaklı dip sos",icon:"🧅",grad:"#6C757D,#FF6B6B"},
    {name:"Mozzarella Sticks",price:"110 ₺",desc:"6 adet mozzarella stick, marinara sos",icon:"🧀",grad:"#FF6B6B,#4ECDC4"}
  ],
  "Salatalar": [
    {name:"Çoban Salata",price:"95 ₺",desc:"Domates, salatalık, biber, soğan, maydanoz, zeytinyağı",icon:"🥗",grad:"#4ECDC4,#FF6B6B"},
    {name:"Ton Balıklı Salata",price:"145 ₺",desc:"Ton balığı, karışık yeşillik, mısır, zeytin, limon sos",icon:"🥗",grad:"#FF6B6B,#4ECDC4"},
    {name:"Sezar Salata",price:"135 ₺",desc:"Marul, tavuk göğsü, parmesan, kruton, sezar sos",icon:"🥗",grad:"#6C757D,#4ECDC4"}
  ],
  "Tatlılar": [
    {name:"Sufle",price:"120 ₺",desc:"Sıcak çikolatalı sufle, vanilyalı dondurma ile",icon:"🍫",grad:"#FF8E53,#A78BFA"},
    {name:"Waffle",price:"140 ₺",desc:"Çilek, muz, çikolata sos, fındık parçacıkları",icon:"🧇",grad:"#A78BFA,#FF8E53"},
    {name:"Baklava",price:"110 ₺",desc:"4 dilim cevizli baklava",icon:"🥮",grad:"#6C757D,#FF8E53"}
  ],
  "Soğuk Kahveler": [
    {name:"Ice Americano",price:"75 ₺",desc:"Espresso, buz, soğuk su",icon:"☕",grad:"#FF6B6B,#6C757D"},
    {name:"Ice Latte",price:"85 ₺",desc:"Espresso, soğuk süt, buz",icon:"☕",grad:"#FF6B6B,#4ECDC4"},
    {name:"Cold Brew",price:"90 ₺",desc:"12 saat demlenmiş soğuk kahve",icon:"☕",grad:"#6C757D,#FF6B6B"}
  ],
  "Sıcak İçecekler": [
    {name:"Türk Kahvesi",price:"55 ₺",desc:"Geleneksel Türk kahvesi, lokum ile",icon:"☕",grad:"#6C757D,#FF8E53"},
    {name:"Çay",price:"25 ₺",desc:"Demli çay",icon:"🍵",grad:"#4ECDC4,#FF6B6B"},
    {name:"Sıcak Çikolata",price:"70 ₺",desc:"Belçika çikolatası, krema",icon:"🍫",grad:"#FF8E53,#A78BFA"}
  ]
};

const root = document.getElementById('menu');
Object.entries(menu).forEach(([cat,items])=>{
  const sec = document.createElement('div'); sec.className='category';
  sec.innerHTML = `<h2>${cat}</h2><div class="grid"></div>`;
  const grid = sec.querySelector('.grid');
  items.forEach(item=>{
    const card = document.createElement('div'); card.className='card';
    const bgStyle = item.img 
      ? `background-image:url('${item.img}');background-color:#f0f0f0;` 
      : `background:linear-gradient(135deg,${item.grad});`;
    card.innerHTML = `<div class="card-img" style="${bgStyle}">${item.icon || ''}</div><div class="card-name">${item.name}</div><div class="card-price">${item.price}</div>`;
    card.onclick = ()=>openModal(item);
    grid.appendChild(card);
  });
  root.appendChild(sec);
});

function openModal(item){
  const overlay = document.getElementById('modal-overlay');
  const card = document.getElementById('modal-card');
  const modalImg = document.getElementById('modal-img');
  
  if(item.img){
    modalImg.style.backgroundImage = `url('${item.img}')`;
    modalImg.style.background = `linear-gradient(135deg,${item.grad})`;
    modalImg.style.backgroundImage = `url('${item.img}')`;
    modalImg.textContent = '';
  } else {
    modalImg.style.backgroundImage = '';
    modalImg.style.background = `linear-gradient(135deg,${item.grad})`;
    modalImg.textContent = item.icon;
  }
  
  document.getElementById('modal-title').textContent = item.name;
  document.getElementById('modal-desc').textContent = item.desc;
  document.getElementById('modal-price').textContent = item.price;
  overlay.style.display = 'flex';
  requestAnimationFrame(()=>card.classList.add('active'));
}

function closeModal(e){
  if(e && e.target !== e.currentTarget) return;
  const card = document.getElementById('modal-card');
  card.classList.remove('active');
  setTimeout(()=>document.getElementById('modal-overlay').style.display='none',200);
}
</script>

</body>
</html>
